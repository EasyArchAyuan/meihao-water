name: Backfill releases

# 一次性用途：为已发布但漏打 tag 的版本补 tag + 建 GitHub Release。
# ⚠️ 必须在首次启用 ci-cd.yml 的 release job 之前跑完，否则 semantic-release
#    会以 v1.0.5 为基线算出错误的下一个版本。
# 幂等：已存在的 tag / release 会跳过，可安全重跑。

on:
  workflow_dispatch:
  # ⚠️ GitHub 对 tag push 事件用的是「该 tag 所指 commit 里」的 workflow 定义。
  #    历史 tag（v1.0.6–v1.0.11）指向引入本文件之前的 commit，因此**不会**触发本 workflow
  #    —— 回填请用 workflow_dispatch（Actions → Backfill releases → Run workflow）。
  #    下面这个触发器只对「在已包含本文件的 commit 上新打的 v1.0.x tag」有效。
  push:
    tags:
      - "v1.0.*"

permissions:
  contents: write

jobs:
  backfill:
    name: Backfill v1.0.6 – v1.0.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Create annotated tags & releases from CHANGELOG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 版本 → commit（“批次末提交”规则：tag 的树 = 该版本最终上线的树）
          declare -A MAP=(
            [1.0.6]=99f5569
            [1.0.7]=b65d26f
            [1.0.8]=e590e8c
            [1.0.9]=903ad20
            [1.0.10]=b1a6b62
            [1.0.11]=f403a28
          )
          ORDER="1.0.6 1.0.7 1.0.8 1.0.9 1.0.10 1.0.11"

          for v in $ORDER; do
            sha="${MAP[$v]}"

            git rev-parse --verify "${sha}^{commit}" >/dev/null \
              || { echo "::error::找不到 commit $sha（v$v）"; exit 1; }

            if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
              echo "tag v$v 已存在，跳过"
            else
              git tag -a "v$v" "$sha" -m "v$v"
              git push origin "v$v"
              echo "created tag v$v -> $sha"
            fi

            # 从 CHANGELOG.md 抽取 "## [x.y.z]" 到下一个 "## " 之间的内容作为 release 正文
            awk -v v="$v" '$0 ~ "^## \\["v"\\]" {f=1; next} f && /^## / {exit} f {print}' \
              CHANGELOG.md > "/tmp/notes-$v.md"

            if [ ! -s "/tmp/notes-$v.md" ]; then
              printf 'v%s — 详见 CHANGELOG.md\n' "$v" > "/tmp/notes-$v.md"
            fi

            if gh release view "v$v" >/dev/null 2>&1; then
              echo "release v$v 已存在，跳过"
            else
              gh release create "v$v" --title "v$v" --notes-file "/tmp/notes-$v.md" --verify-tag
              echo "created release v$v"
            fi
          done

          echo "=== tags ==="
          git tag --list 'v1.0.*' --sort=version:refname
          echo "=== releases ==="
          gh release list --limit 20
